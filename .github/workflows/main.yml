steps:
- uses: actions/checkout@v6
- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.x'
- name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install -e .
- name: Test with pytest
  run: |
    pytest tests/test_image_enhancement_masks.py --doctest-modules --junitxml=junit/test-results.xml
    pytest tests/test_integration_components.py --doctest-modules --junitxml=junit/test-results.xml
    pytest tests/test_polygon_vector_formats.py --doctest-modules --junitxml=junit/test-results.xml
    pytest tests/test_utils.py --doctest-modules --junitxml=junit/test-results.xml


